<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fork Overlay V2 Prototype</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f3f2ef;
        background: #272522;
        font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: minmax(320px, 680px) 260px;
        gap: 22px;
        align-items: start;
      }

      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        overflow: hidden;
        border-radius: 3px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.36);
      }

      .square {
        position: relative;
        display: grid;
        place-items: center;
      }

      .light { background: #eeeed2; }
      .dark { background: #769656; }

      .piece {
        position: relative;
        width: 82%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        color: #f9f9f9;
        font-size: clamp(34px, 7vw, 68px);
        line-height: 1;
        text-shadow: 0 2px 0 #555, 0 4px 8px rgba(0, 0, 0, 0.45);
        z-index: 2;
      }

      .piece.black {
        color: #3f3f3f;
        text-shadow: 0 1px 0 #999, 0 4px 8px rgba(0, 0, 0, 0.35);
      }

      .fork-move {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 4;
      }

      .fork-line {
        position: absolute;
        left: 31.25%;
        top: 43.75%;
        width: 25%;
        height: 0;
        border-top: 3px solid rgba(255, 214, 89, 0.84);
        transform: rotate(-26deg);
        transform-origin: left center;
      }

      .source-dot {
        position: absolute;
        left: 26.35%;
        top: 55.1%;
        width: 4.8%;
        aspect-ratio: 1;
        border: 2px solid #fff;
        border-radius: 999px;
        background: #ffd659;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
      }

      .destination {
        position: absolute;
        left: 37.5%;
        top: 37.5%;
        width: 12.5%;
        height: 12.5%;
        border: 3px solid #ffd659;
        background: rgba(255, 214, 89, 0.18);
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.42);
      }

      .target {
        position: absolute;
        width: 12.5%;
        height: 12.5%;
        display: grid;
        place-items: center;
      }

      .target::before {
        content: "";
        width: 72%;
        aspect-ratio: 1;
        border: 4px solid #ffd659;
        border-radius: 999px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }

      .target-a { left: 12.5%; top: 12.5%; }
      .target-b { left: 62.5%; top: 25%; }

      aside {
        display: grid;
        gap: 12px;
      }

      .panel {
        padding: 14px;
        border: 1px solid #3f464b;
        border-radius: 8px;
        background: #1f2428;
      }

      h1, h2, p { margin: 0; }
      h1 { font-size: 17px; }
      h2 { margin-bottom: 8px; font-size: 14px; }
      p { color: #cbc7bd; }

      .key {
        display: grid;
        gap: 8px;
      }

      .key-row {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 8px;
        align-items: center;
      }

      .swatch {
        width: 18px;
        height: 18px;
        border: 3px solid #ffd659;
        background: rgba(255, 214, 89, 0.18);
      }

      .swatch.dot {
        border: 2px solid #fff;
        border-radius: 999px;
        background: #ffd659;
      }

      .swatch.ring {
        border-radius: 999px;
        background: transparent;
      }

      @media (max-width: 820px) {
        body { place-items: start center; }
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="board" aria-label="Simplified fork visual prototype">
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"><div class="piece black">&#9818;</div></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"><div class="piece black">&#9820;</div></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"><div class="piece black">&#9819;</div></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"><div class="piece white">&#9816;</div></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>

        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>

        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"></div>
        <div class="square dark"></div>
        <div class="square light"><div class="piece white">&#9812;</div></div>

        <div class="fork-move">
          <span class="source-dot" aria-hidden="true"></span>
          <span class="fork-line" aria-hidden="true"></span>
          <span class="destination" aria-hidden="true"></span>
          <span class="target target-a" aria-hidden="true"></span>
          <span class="target target-b" aria-hidden="true"></span>
        </div>
      </section>

      <aside>
        <section class="panel">
          <h1>Fork Visual V2</h1>
          <p>One color, no letters on the board, and only one candidate shown at a time.</p>
        </section>

        <section class="panel key" aria-label="Legend">
          <h2>Legend</h2>
          <div class="key-row"><span class="swatch dot"></span><p>source piece</p></div>
          <div class="key-row"><span class="swatch"></span><p>destination square</p></div>
          <div class="key-row"><span class="swatch ring"></span><p>winning targets</p></div>
        </section>

        <section class="panel">
          <h2>Logic Goal</h2>
          <p>Show only forks that survive the opponent response check and are likely to win material.</p>
        </section>
      </aside>
    </main>
  </body>
</html>
